<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PHYSX ENGINEER</title>
    <meta name="description" content="Login to your student account">
</head>
<body>
    <div class="hero" style="min-height: 50vh;">
        <div class="hero-content">
            <div class="hero-badge"><span class="dot"></span> Student Login</div>
            <h1>Access Your Account</h1>
            <p class="hero-sub">Welcome back to your learning journey</p>
        </div>
    </div>

    <section class="section">
        <div class="container">
            <div class="form-card" style="margin-top: 40px;">
                <h2 style="text-align: center; margin-bottom: 24px;">Login to Dashboard</h2>

                <form id="login-form">
                    <div class="form-group">
                        <label for="loginEmail">Email or Mobile *</label>
                        <input type="text" id="loginEmail" name="loginEmail" required placeholder="student@example.com or 9876543210">
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password *</label>
                        <input type="password" id="loginPassword" name="loginPassword" required placeholder="••••••••">
                    </div>

                    <div style="text-align: center; margin-top: 24px;">
                        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Login</button>
                    </div>

                    <div style="margin-top: 20px; text-align: center; font-size: 0.85rem;">
                        <p>Don't have an account? <a href="register.html" style="color: var(--accent-secondary);">Register here</a></p>
                        <p>Demo Login: <span style="font-weight: 600;">student@example.com</span> / <span style="font-weight: 600;">demo123</span></p>
                        <p style="font-size: 0.75rem; color: var(--text-muted);">*Demo credentials for testing only</p>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <div style="margin: 40px 24px; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
        <p>Need help? Email <a data-config="email" href="mailto:engineeringphysicsacademy@gmail.com">engineeringphysicsacademy@gmail.com</a>.</p>
    </div>
    <script src="data/config.js"></script><script src="js/site-shell.js"></script>
</body>
</html>
